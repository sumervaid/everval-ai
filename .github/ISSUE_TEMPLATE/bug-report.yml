name: Bug report
description: Report reproducible behavior in Everval's terminal, CLI, API, or browser.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe a minimal reproduction using original or synthetic data.
        Keep credentials, private task material, hidden checks, model traces, and workspace exports out of the report.
        For a vulnerability, follow the [private security reporting route](https://github.com/sumervaid/everval-continuous-benchmarking/blob/main/SECURITY.md#reporting-a-vulnerability).
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Terminal or tmux
        - CLI
        - API or browser
        - Repository onboarding or environments
        - Task validation or grading
        - Providers or agent adapters
        - Automation, budgets, or recovery
        - Installation or documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Everval version or commit
      description: Use the release version or the output of git rev-parse --short HEAD.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include the smallest commands or interface steps. Describe any required fixture without sharing private data.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Explain what should happen and what happened instead. Include the frequency if it is intermittent.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include OS and Python version. Add terminal name and size for TUI problems, browser for web problems, or Docker/runtime details for execution problems. Omit private paths and host names.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal supporting evidence
      description: Optional sanitized error excerpt or screenshot. Review attachments for private material before submitting.
