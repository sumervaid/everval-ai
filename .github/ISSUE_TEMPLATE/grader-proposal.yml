name: Grader proposal
description: Propose a bounded evaluator with meaningful correctness evidence.
title: "[Grader] "
body:
  - type: markdown
    attributes:
      value: |
        Read the [scenario contract](https://github.com/sumervaid/everval-continuous-benchmarking/blob/main/docs/scenarios.md) before proposing a grader.
        Describe behavior with original or shareable examples. Keep hidden customer checks, private answers, and traces out of this issue.
  - type: textarea
    id: contract
    attributes:
      label: What behavior does the grader establish?
      description: Define inputs, outputs, success criteria, unsupported cases, and intended users.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Isolation and resource limits
      description: Describe execution requirements, network policy, private-material separation, timeouts, and bounded work. Imported community packs cannot install custom graders.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Controls and verification
      description: Supply passing references, realistic failing controls, infrastructure-failure handling, and reproducible tests. Include licenses for reused work.
    validations:
      required: true
