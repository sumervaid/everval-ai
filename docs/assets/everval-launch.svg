<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Everval AI — Know what improved. Know what it cost.</title>
  <desc id="description">On-prem continuous benchmarking for AI models and agents. Freeze a benchmark, compare changes, and inspect the evidence. A completed local Qwen 0.5B study used three training runs, twelve checkpoints, and 3,072 model responses on generated diagnostic tasks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#122c2a"/>
      <stop offset="1" stop-color="#0b1b20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#94dfc7"/>
      <stop offset="1" stop-color="#476e65"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6b978b" opacity=".15"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <g transform="translate(40 5)">
  <rect x="807" width="393" height="471" fill="url(#grid)"/>
  <path d="M0 471H1200" stroke="#46625a" stroke-opacity=".65"/>
  <rect x="47" y="43" width="47" height="47" rx="12" fill="#214c42" stroke="#5c9a85"/>
  <path d="M60 56h13m-13 10h10m-10 11h13m12-21-7 21" fill="none" stroke="#acead4" stroke-width="3.5" stroke-linecap="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="110" y="77" font-size="30" font-weight="650" letter-spacing="-.8" fill="#f3f1e6">Everval AI</text>
    <rect x="960" y="48" width="210" height="31" rx="15.5" fill="#18372f" stroke="#385e50"/>
    <text x="1065" y="69" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.3" fill="#b4d5c3">YOUR WORK. YOUR EVALS.</text>

    <text x="46" y="192" font-size="61" font-weight="650" letter-spacing="-2.1" fill="#f3f1e6">Know what improved.</text>
    <text x="46" y="265" font-size="61" font-weight="650" letter-spacing="-2.1" fill="#9bdfc3">Know what it cost.</text>
    <text x="49" y="324" font-size="25" fill="#d7e1d9">On-prem continuous benchmarking</text>
    <text x="49" y="358" font-size="25" fill="#d7e1d9">for AI models and agents.</text>

    <g font-size="14" fill="#a5bdb2">
      <text x="49" y="417">Terminal + browser</text>
      <circle cx="206" cy="412" r="2" fill="#5b7c6e"/>
      <text x="222" y="417">Local evidence</text>
      <circle cx="351" cy="412" r="2" fill="#5b7c6e"/>
      <text x="367" y="417">Quality, cost + latency</text>
    </g>

    <path d="M842 180V372" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <g>
      <rect x="817" y="149" width="335" height="68" rx="11" fill="#16332f" stroke="#37594d"/>
      <circle cx="844" cy="183" r="13" fill="#2b5748"/>
      <text x="844" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#b8ead4">1</text>
      <text x="871" y="180" font-size="18" font-weight="600" fill="#e6eee5">Freeze the benchmark</text>
      <text x="871" y="201" font-size="12" fill="#9fb7aa">Keep the comparison consistent.</text>
    </g>
    <g>
      <rect x="817" y="244" width="335" height="68" rx="11" fill="#16332f" stroke="#37594d"/>
      <circle cx="844" cy="278" r="13" fill="#2b5748"/>
      <text x="844" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="#b8ead4">2</text>
      <text x="871" y="275" font-size="18" font-weight="600" fill="#e6eee5">Compare every change</text>
      <text x="871" y="296" font-size="12" fill="#9fb7aa">Models, prompts, agents, checkpoints.</text>
    </g>
    <g>
      <rect x="817" y="339" width="335" height="68" rx="11" fill="#16332f" stroke="#37594d"/>
      <circle cx="844" cy="373" r="13" fill="#2b5748"/>
      <text x="844" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#b8ead4">3</text>
      <text x="871" y="370" font-size="18" font-weight="600" fill="#e6eee5">Inspect the evidence</text>
      <text x="871" y="391" font-size="12" fill="#9fb7aa">See failures, uncertainty and trade-offs.</text>
    </g>

    <text x="49" y="509" font-size="11" font-weight="600" letter-spacing="1.8" fill="#9eb7ab">COMPLETED CHECKPOINT STUDY</text>
    <text x="49" y="548" font-size="26" font-weight="600" letter-spacing="-.3" fill="#edf0e6">3 training runs <tspan fill="#55786a">·</tspan> 12 checkpoints <tspan fill="#55786a">·</tspan> 3,072 model responses</text>
    <text x="49" y="574" font-size="13" fill="#9eb7ab">Local Qwen2.5-0.5B-Instruct · Generated diagnostic tasks · Protocol, results + reproduction included</text>
    <text x="49" y="609" font-size="14" fill="#cce3d4">github.com/sumervaid/everval-ai</text>
    <text x="1151" y="609" text-anchor="end" font-size="12" letter-spacing="1" fill="#9eb7ab">OPEN SOURCE · APACHE 2.0</text>
  </g>
  </g>
</svg>
