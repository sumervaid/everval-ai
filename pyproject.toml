[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "everval-ai"
version = "0.2.0"
description = "A local workbench for evaluating agents on real work."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Sumer S. Vaid"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "pypdf>=5,<7",
  "textual>=0.89,<8",
  "packaging>=24,<27",
]

[project.scripts]
everval = "cvals.cli:app"
cvals = "cvals.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-PyYAML>=6",
    "types-jsonschema>=4",
    "pip-audit>=2.9,<3",
    "playwright>=1.51,<2",
]

[tool.hatch.build]
artifacts = ["src/cvals/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/cvals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sandbox: requires an isolated Docker runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cvals"]
