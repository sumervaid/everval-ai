[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "everval-ai"
version = "0.4.0"
description = "Continuous benchmarking and calibrated model evaluation on your infrastructure."
readme = "README.pypi.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Sumer S. Vaid"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "pypdf>=5,<7",
  "textual>=0.89,<8",
  "packaging>=24,<27",
]

[project.urls]
Homepage = "https://github.com/sumervaid/everval-ai"
Documentation = "https://github.com/sumervaid/everval-ai/blob/main/docs/index.md"
Issues = "https://github.com/sumervaid/everval-ai/issues"
Changelog = "https://github.com/sumervaid/everval-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.285"]

[project.scripts]
everval = "everval.cli:main"
cvals = "cvals.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-PyYAML>=6",
    "types-jsonschema>=4",
    "pip-audit>=2.9,<3",
    "playwright>=1.51,<2",
]

[tool.hatch.build]
artifacts = ["src/cvals/static/**"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "scripts", "deploy", "web", "npm", "docs", ".github", "pyproject.toml", "uv.lock", "README.md", "README.pypi.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "SUPPORT.md", "Makefile", "AGENTS.md"]
exclude = ["/docs/assets", "/.local", "/.state", "/.git"]

[tool.hatch.build.targets.wheel]
packages = ["src/cvals", "src/everval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sandbox: requires an isolated Docker runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cvals", "everval"]
